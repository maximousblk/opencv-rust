name: opencv-rust
on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  src:
    strategy:
      fail-fast: false
      matrix:
        os-image:
          - ubuntu-24.04
          - macos-15
        opencv-version:
          - 4.11.0
        linkage:
          - dynamic
        include:
          - os-image: ubuntu-24.04
            opencv-version: 4.11.0
            linkage: static
          - os-image: ubuntu-24.04
            opencv-version: 5.0.0-alpha
            linkage: dynamic
          - os-image: ubuntu-22.04
            opencv-version: 3.4.20
            linkage: dynamic
          - os-image: macos-13
            opencv-version: 3.4.20
            linkage: dynamic
    runs-on: ${{ matrix.os-image }}
    env:
      Atlas_ROOT_DIR: /usr/include/ # for cmake to find lapacke.h
      OPENCV_VERSION: ${{ matrix.opencv-version }}
      OPENCV_LINKAGE: ${{ matrix.linkage }}
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: actions/cache@v4
        with:
          path: ~/build
          key: build-${{ matrix.opencv-version }}-${{ matrix.linkage }}-${{ matrix.os-image }}

      - name: Install dependencies
        run: ci/install.sh
        shell: bash

      - name: Test project
        run: ci/script.sh
        shell: bash

  vcpkg:
    strategy:
      fail-fast: false
      matrix:
        os-image:
          - ubuntu-24.04
          - windows-2025
          - macos-15
        vcpkg-version:
          - 2025.04.09 # https://github.com/microsoft/vcpkg/releases
        vcpkg-features-cache-key:
          - full
        vcpkg-features:
          - contrib,imgproc,imgcodecs
    runs-on: ${{ matrix.os-image }}
    env:
      VCPKG_VERSION: ${{ matrix.vcpkg-version }}
      VCPKG_FEATURES: ${{ matrix.vcpkg-features }}
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: actions/cache@v4
        with:
          path: ~/build
          key: vcpkg-${{ matrix.vcpkg-version }}-${{ matrix.os-image }}-${{ matrix.vcpkg-features-cache-key }}

      - name: Install dependencies
        run: ci/install.sh
        shell: bash

      - name: Test project
        run: ci/script.sh
        shell: bash
